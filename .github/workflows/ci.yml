name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate syntax
        run: |
          python -m py_compile app.py
          python -m py_compile app/__init__.py
          python -m py_compile app/routes/main.py
          python -m py_compile app/services/openai_service.py
          python -m py_compile app/utils/storage.py
          python -m py_compile app/utils/normalize.py
          python -m py_compile app/utils/config_manager.py
          python -m py_compile app/utils/preflight.py
          python -m py_compile app/utils/logging_service.py
      - name: Import check
        run: |
          python -c "import app; print('✓ app import ok')"
          python -c "from app.utils import config, preflight; print('✓ utils import ok')"
          python -c "from app.services import OpenAIService; print('✓ services import ok')"
      - name: Run tests
        run: |
          pytest tests/ -v

      - name: Validate Docker build
        run: |
          docker build -t financial-nebula-node:test .

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/deployable'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image to Docker Hub
        if: github.ref == 'refs/heads/deployable'
        run: |
          docker build -t taig2k/financial-nebula-node:latest -t taig2k/financial-nebula-node:${{ github.sha }} .
          docker push taig2k/financial-nebula-node:latest
          docker push taig2k/financial-nebula-node:${{ github.sha }}
