{% extends 'base.html' %}
{% block content %}
<h2>Add Transaction</h2>
<form method="post">
  <label>Amount: <input name="amount" type="number" step="0.01" required></label><br/>
  <label>Merchant: <input name="merchant" required></label><br/>
  <label>Category: <input name="category"></label><br/>
  <label>Date (YYYY-MM-DD): <input name="date" type="date"></label><br/>
  <label>Note: <input name="note"></label><br/>
  <br/>
  <button type="submit">Add</button>
</form>
{% endblock %}
