{% extends 'base.html' %}
{% block content %}
<h2>Upload Receipt</h2>
<form method="post" enctype="multipart/form-data">
  <label>Select receipt image: <input type="file" name="receipt" accept="image/*" required></label>
  <br/><small>Allowed: PNG, JPG, JPEG, WebP (max 10MB)</small>
  <br/><br/>
  <button type="submit">Upload</button>
</form>
{% endblock %}
