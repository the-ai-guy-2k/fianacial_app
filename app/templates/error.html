{% extends 'base.html' %}
{% block content %}
<h2>{{ title }}</h2>

<section>
  <div class="error-box">
    <h3>Startup Errors</h3>
    <p style="margin-top: 0;">The application encountered the following errors during startup:</p>
    <ul>
      {% for error in errors %}
        <li>{{ error }}</li>
      {% endfor %}
    </ul>
    <p style="margin-bottom: 0; font-size: 0.9rem;">
      For more details, check the logs at: <code>logs/app.log</code>
    </p>
  </div>
</section>
{% endblock %}
